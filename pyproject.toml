[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-threat-sentinel"
version = "0.1.0"
description = "Intrusion detection that reads your logs. Rules plus unsupervised ML."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "TIENDUNG21" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]
keywords = ["intrusion-detection", "security", "logs", "mitre-attack", "isolation-forest"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Logging",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "mypy>=1.10", "ruff>=0.6"]

[project.scripts]
argus = "argus.cli:main"

[project.urls]
Homepage = "https://github.com/TIENDUNG21/argus-threat-sentinel"
"Sample report" = "https://tiendung21.github.io/argus-threat-sentinel/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
argus = ["py.typed", "rules/builtin/*.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PTH", "RET", "PIE", "PERF"]

[tool.ruff.lint.isort]
known-first-party = ["argus"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
